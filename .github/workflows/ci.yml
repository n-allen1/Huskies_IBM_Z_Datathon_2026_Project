name: CI/CD

# Every pull request and every push to main is validated. A push to main that passes every job is then deployed to the
# LinuxONE VM as a container stack (web UI + API). See docs/ci-cd.md.
on:
  pull_request:
    # labeled/unlabeled so the contract-approved label re-runs the contract gate.
    types: [opened, synchronize, reopened, labeled, unlabeled]
  push:
    branches: [main]
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: ci-${{ github.ref }}
  # Superseded pull request runs are wasted work; a run on main is never canceled (it may be a deploy).
  cancel-in-progress: ${{ github.event_name == 'pull_request' }}

# Everything that could change under us is pinned: the runner image, each action (to a commit SHA), Python, Node, and every pip
# package (.github/pins/*.lock). Updating any of them is a deliberate pull request; see docs/ci-cd.md, "Updating pinned versions".
env:
  PYTHON_VERSION: "3.12.15"
  NODE_VERSION: "22.23.3"

jobs:
  contract:
    name: OpenAPI contract
    runs-on: ubuntu-24.04
    steps:
      - uses: actions/checkout@d23441a48e516b6c34aea4fa41551a30e30af803 # v6.1.0
        with:
          fetch-depth: 0

      - uses: actions/setup-python@ece7cb06caefa5fff74198d8649806c4678c61a1 # v6.3.0
        with:
          python-version: ${{ env.PYTHON_VERSION }}

      - name: Validate and check for drift from the generator
        run: |
          pip install --no-deps -r .github/pins/minimal.lock
          pip check
          python scripts/check_contract.py

      - name: Lint with Redocly
        # Errors fail the job. The "unused component" warnings are expected: SSE payload schemas are not referenced by a response.
        run: npx --yes @redocly/cli@2.64.1 lint contracts/openapi.json

      - name: Require approval to change the contract
        if: github.event_name == 'pull_request'
        env:
          BASE_REF: ${{ github.base_ref }}
          APPROVED: ${{ contains(github.event.pull_request.labels.*.name, 'contract-approved') }}
        run: |
          changed="$(git diff --name-only "origin/${BASE_REF}...HEAD" -- contracts/openapi.json scripts/gen_openapi.py)"
          if [ -z "$changed" ]; then
            echo "The contract and its generator are unchanged."
            exit 0
          fi
          echo "Changed contract files:"; echo "$changed"
          if [ "$APPROVED" != "true" ]; then
            echo "::error::This PR changes the API contract. CLAUDE.md requires explicit human approval first. After a reviewer has approved the amendment, they add the 'contract-approved' label."
            exit 1
          fi
          echo "Contract change carries the contract-approved label."

  backend:
    name: Backend tests (${{ matrix.deps }})
    runs-on: ubuntu-24.04
    strategy:
      fail-fast: false
      matrix:
        # "minimal" is a clean checkout without xgboost (the ETA tests skip, the model degrades to straight-line);
        # "full" installs xgboost so the ETA model tests run too. Torch is not installed: its tests skip, and the
        # Granite and NNPA paths are tested on the VM during deploy.
        deps: [minimal, full]
    steps:
      - uses: actions/checkout@d23441a48e516b6c34aea4fa41551a30e30af803 # v6.1.0

      - uses: actions/setup-python@ece7cb06caefa5fff74198d8649806c4678c61a1 # v6.3.0
        with:
          python-version: ${{ env.PYTHON_VERSION }}
          cache: pip
          cache-dependency-path: .github/pins/*.lock

      - name: Install
        # --no-deps installs exactly the lock and nothing else; pip check then fails if the lock is missing a dependency.
        run: |
          pip install --no-deps -r .github/pins/${{ matrix.deps }}.lock
          pip check

      - name: Lint (syntax errors and undefined names)
        run: ruff check --select E9,F63,F7,F82,F811 backend scripts

      - name: Test
        working-directory: backend
        run: python -m pytest -q -ra

  frontend:
    name: Frontend build
    runs-on: ubuntu-24.04
    defaults:
      run:
        working-directory: frontend
    steps:
      - uses: actions/checkout@d23441a48e516b6c34aea4fa41551a30e30af803 # v6.1.0

      # The web UI lives on feature/Frontend until it is merged; once frontend/ exists on a branch, these steps start running.
      - name: Detect the frontend
        id: detect
        working-directory: .
        run: |
          if [ -f frontend/package.json ]; then echo "present=true" >> "$GITHUB_OUTPUT"
          else echo "present=false" >> "$GITHUB_OUTPUT"; echo "::notice::No frontend/package.json on this branch; skipping the frontend checks."; fi

      - uses: actions/setup-node@249970729cb0ef3589644e2896645e5dc5ba9c38 # v6.5.0
        if: steps.detect.outputs.present == 'true'
        with:
          node-version: ${{ env.NODE_VERSION }}
          cache: npm
          cache-dependency-path: frontend/package-lock.json

      - name: Install
        if: steps.detect.outputs.present == 'true'
        run: npm ci

      - name: Generated API types match the contract
        if: steps.detect.outputs.present == 'true'
        run: |
          npm run gen:types
          git diff --exit-code -- src/lib/api/schema.d.ts || { echo "::error::frontend/src/lib/api/schema.d.ts is stale. Run scripts/regen_types.sh and commit the result."; exit 1; }

      - name: Type check
        if: steps.detect.outputs.present == 'true'
        run: npm run check

      - name: Unit tests
        if: steps.detect.outputs.present == 'true'
        run: npm test

      - name: Build
        if: steps.detect.outputs.present == 'true'
        run: npm run build

  containers:
    name: Containers
    runs-on: ubuntu-24.04
    steps:
      - uses: actions/checkout@d23441a48e516b6c34aea4fa41551a30e30af803 # v6.1.0

      # compose.yml is the same file the VM runs. Here the API sits on a stock Python image (compose.local.yml), because IBM's
      # s390x image cannot run on this x86 runner; the web image, nginx config and proxying are exactly what is deployed.
      - name: Start the stack
        run: |
          export WEB_BIND=0.0.0.0 WEB_PORT=8080
          docker compose -f compose.yml -f compose.local.yml up -d --build --wait --wait-timeout 300

      - name: Check the app through the proxy
        run: |
          base=http://127.0.0.1:8080
          code() { curl -s -o /dev/null -w '%{http_code}' "$@"; }
          curl -fsS "$base/healthz"
          # Into variables, not `curl | grep -q`: grep exiting early makes curl fail.
          page="$(curl -fsS "$base/")"; grep -qi '<html' <<< "$page"
          page="$(curl -fsS "$base/dispatch")"; grep -qi '<html' <<< "$page"   # unknown paths get the single-page app shell
          curl -fsS "$base/api/v1/health"; echo
          [ "$(code "$base/api/v1/resources/units?limit=1")" = 401 ]
          [ "$(code -H 'Authorization: Bearer demo-dispatcher' "$base/api/v1/resources/units?limit=1")" = 200 ]
          # Operator endpoints are not reachable through the public listener, even with an admin token.
          [ "$(code -X POST -H 'Authorization: Bearer demo-admin' "$base/api/v1/admin/demo/reset")" = 403 ]

      - name: The UI renders over plain HTTP on a non-loopback address
        # Browsers expose some APIs (crypto.randomUUID, for one) only in secure contexts: HTTPS or localhost. The VM is served over
        # plain HTTP from its IP address, so a page that uses one while initializing is blank there but fine on localhost and in
        # unit tests. Chrome treats this runner's own address the same way, so render the pages through it.
        run: |
          ip="$(hostname -I | awk '{print $1}')"
          for page in dispatch intake; do
            timeout 120 google-chrome --headless=new --no-sandbox --disable-gpu --virtual-time-budget=15000               --enable-logging=stderr --v=0 --dump-dom "http://${ip}:8080/${page}" > "dom_${page}.html" 2> "chrome_${page}.log" || true
            if ! grep -q '<header' "dom_${page}.html" || grep -q 'Uncaught' "chrome_${page}.log"; then
              echo "::error::/${page} did not render over plain HTTP on a non-loopback address."
              grep CONSOLE "chrome_${page}.log" | head -5
              exit 1
            fi
            echo "/${page} rendered"
          done

      - name: The proxy follows a recreated API container
        # Every deploy recreates the API container with a new address; nginx must not keep the old one.
        run: |
          docker compose -f compose.yml -f compose.local.yml up -d --no-build --force-recreate --no-deps --wait --wait-timeout 120 api
          for _ in $(seq 1 20); do
            [ "$(curl -s -o /dev/null -w '%{http_code}' http://127.0.0.1:8080/api/v1/health)" = 200 ] && exit 0
            sleep 2
          done
          echo "::error::The proxy did not reach the recreated API container."; exit 1

      - name: Container logs
        if: failure()
        run: docker compose -f compose.yml -f compose.local.yml logs --tail 80

      - name: Web image for the VM (linux/s390x) builds, exports and loads
        # The deploy script's exact path. The Node stage runs natively on this runner and the final stage only copies files, so
        # no emulation is involved.
        run: |
          docker buildx build --platform linux/s390x --load -t dispatchz-web:s390x frontend
          docker save dispatchz-web:s390x | gzip -1 > web.tar.gz
          docker rmi dispatchz-web:s390x
          gunzip -c web.tar.gz | docker load
          arch="$(docker image inspect -f '{{.Architecture}}' dispatchz-web:s390x)"
          echo "loaded image architecture: $arch"
          [ "$arch" = s390x ]

  hygiene:
    name: Repository hygiene
    runs-on: ubuntu-24.04
    steps:
      - uses: actions/checkout@d23441a48e516b6c34aea4fa41551a30e30af803 # v6.1.0

      - name: Shell scripts parse
        run: for f in scripts/*.sh; do bash -n "$f" && echo "ok $f"; done

      - name: No secrets or key files are committed
        run: |
          if git ls-files | grep -Ei '\.(pem|key|p12|pfx)$|(^|/)\.env$'; then
            echo "::error::A key file or .env is tracked."; exit 1
          fi
          if git grep -nE -e '-----BEGIN [A-Z ]*PRIVATE KEY-----' -- . ':!.github/workflows/ci.yml'; then
            echo "::error::A private key is committed."; exit 1
          fi
          echo "clean"

      - name: Files that must be LF are LF in the index
        run: |
          if git ls-files --eol -- '*.sh' '*Dockerfile' '.dockerignore' '*.conf' 'compose*.yml' 'backend/requirements*.txt' backend/constraints.txt '.github/pins/*' .env.example | grep 'i/crlf'; then
            echo "::error::CRLF line endings are committed; they break Docker and bash on the VM."; exit 1
          fi
          echo "clean"

  deploy:
    name: Deploy to LinuxONE
    # Runs only after every check above passed, and only for main. Pull requests never deploy.
    needs: [contract, backend, frontend, containers, hygiene]
    if: >-
      github.ref == 'refs/heads/main' &&
      (github.event_name == 'push' || github.event_name == 'workflow_dispatch')
    runs-on: ubuntu-24.04
    environment: linuxone
    concurrency:
      group: deploy-linuxone
      cancel-in-progress: false
    timeout-minutes: 45
    steps:
      - uses: actions/checkout@d23441a48e516b6c34aea4fa41551a30e30af803 # v6.1.0

      - name: Check deploy configuration
        id: config
        env:
          VM_SSH_KEY: ${{ secrets.VM_SSH_KEY }}
          VM_HOST: ${{ secrets.VM_HOST }}
        run: |
          if [ -z "$VM_SSH_KEY" ] || [ -z "$VM_HOST" ]; then
            echo "configured=false" >> "$GITHUB_OUTPUT"
            echo "::warning::Deploy skipped: the VM_SSH_KEY and VM_HOST secrets are not set. See docs/ci-cd.md."
            echo "### Deploy skipped" >> "$GITHUB_STEP_SUMMARY"
            echo "The \`VM_SSH_KEY\` and \`VM_HOST\` secrets are not configured, so nothing was deployed. See docs/ci-cd.md." >> "$GITHUB_STEP_SUMMARY"
          else
            echo "configured=true" >> "$GITHUB_OUTPUT"
          fi

      - name: Deploy (images are built, tests run on the VM, then the stack is replaced)
        if: steps.config.outputs.configured == 'true'
        env:
          VM_SSH_KEY: ${{ secrets.VM_SSH_KEY }}
          VM_HOST: ${{ secrets.VM_HOST }}
          # Optional. Output of `ssh-keyscan -t ed25519 <vm-ip>`, taken once from a trusted network. Without it the first
          # connection trusts the host key it sees.
          VM_KNOWN_HOSTS: ${{ secrets.VM_KNOWN_HOSTS }}
          DEPLOY_REF: ${{ github.sha }}
        # Explicit shell so that pipefail is on: a failed deploy must fail the job even though its output goes through tee.
        shell: bash
        run: |
          mkdir -p ~/.ssh && chmod 700 ~/.ssh
          export VM_KEY="$RUNNER_TEMP/vm_key"
          (umask 077 && printf '%s\n' "$VM_SSH_KEY" | tr -d '\r' > "$VM_KEY")
          if [ -n "$VM_KNOWN_HOSTS" ]; then printf '%s\n' "$VM_KNOWN_HOSTS" | tr -d '\r' >> ~/.ssh/known_hosts; fi
          bash scripts/deploy_vm.sh 2>&1 | tee "$RUNNER_TEMP/deploy.log"

      - name: Check the public URL from outside the VM
        # The runner is not on the VM's network, so this is what a browser elsewhere sees. If it fails the deploy itself is fine
        # (the VM already verified the stack); the usual cause is a firewall rule. Warns instead of failing so a network setting
        # cannot mark a good deploy as broken. The address is derived from a secret and deliberately never printed.
        if: steps.config.outputs.configured == 'true'
        env:
          VM_HOST: ${{ secrets.VM_HOST }}
          WEB_PORT: ${{ vars.VM_WEB_PORT || '80' }}
        shell: bash
        run: |
          host="${VM_HOST#*@}"
          status=000
          for _ in $(seq 1 10); do
            status="$(curl -s -o /dev/null --max-time 10 -w '%{http_code}' "http://${host}:${WEB_PORT}/api/v1/health" || true)"
            [ "$status" = 200 ] && break
            sleep 3
          done
          if [ "$status" = 200 ]; then
            echo "### Public URL reachable" >> "$GITHUB_STEP_SUMMARY"
            echo "The app answered over HTTP on port ${WEB_PORT} from outside the VM." >> "$GITHUB_STEP_SUMMARY"
          else
            echo "::warning::The stack is healthy on the VM but http://<vm>:${WEB_PORT}/ did not answer from the internet (last status ${status}). Open the port in the VM's firewall; see docs/deployment.md, Public access."
            echo "### Public URL NOT reachable" >> "$GITHUB_STEP_SUMMARY"
            echo "Healthy on the VM, but port ${WEB_PORT} did not answer from the internet (status ${status}). See docs/deployment.md, Public access." >> "$GITHUB_STEP_SUMMARY"
          fi

      - name: Summary
        if: steps.config.outputs.configured == 'true'
        run: |
          {
            echo "### Deployed \`${GITHUB_SHA::7}\` to the LinuxONE VM"
            echo '```'
            tail -n 8 "$RUNNER_TEMP/deploy.log"
            echo '```'
          } >> "$GITHUB_STEP_SUMMARY"

      - name: Remove the key
        if: always()
        run: rm -f "$RUNNER_TEMP/vm_key"
