# Dependabot opens a pull request when a pinned version has an update. Nothing merges by itself: each PR runs the full CI, and a
# person decides. Pins that Dependabot cannot read (.github/pins/*.lock, backend/constraints.txt, the Docker base image digest)
# are updated by hand; see docs/ci-cd.md, "Updating pinned versions".
version: 2
updates:
  # Actions are pinned to commit SHAs with a version comment; Dependabot updates both.
  - package-ecosystem: github-actions
    directory: /
    schedule:
      interval: weekly
      day: monday
    open-pull-requests-limit: 3
    groups:
      github-actions:
        patterns: ["*"]

  - package-ecosystem: npm
    directory: /frontend
    schedule:
      interval: weekly
      day: monday
    open-pull-requests-limit: 3
    groups:
      # Patch and minor updates arrive as one PR; a major update is its own PR so it is reviewed on its own.
      frontend-minor-and-patch:
        update-types: [minor, patch]
