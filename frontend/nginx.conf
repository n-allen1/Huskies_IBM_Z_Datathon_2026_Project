# Served from /etc/nginx/conf.d/default.conf inside the web image.

# Docker's embedded DNS. Using it with a variable in proxy_pass makes nginx look the API up on every request (cached 10 s)
# instead of once at start-up. Without this, recreating the API container (every deploy) leaves nginx pointing at the old
# address until it is restarted, and nginx refuses to start at all while the API is down.
resolver 127.0.0.11 valid=10s ipv6=off;

server {
    listen 80;
    server_name _;
    server_tokens off;

    root /usr/share/nginx/html;
    index index.html;

    gzip on;
    gzip_types text/css application/javascript application/json image/svg+xml;

    add_header X-Content-Type-Options nosniff always;
    add_header X-Frame-Options SAMEORIGIN always;
    add_header Referrer-Policy strict-origin-when-cross-origin always;

    # Container health check. Does not touch the API.
    location = /healthz {
        access_log off;
        default_type text/plain;
        return 200 "ok\n";
    }

    # Operator endpoints (demo reset) are not reachable through the public listener. The API is also published on the VM's
    # localhost, so an operator reaches them through an SSH tunnel (docs/deployment.md).
    location ^~ /api/v1/admin/ {
        return 403;
    }

    # The API, including the server-sent event stream (/api/v1/events/stream), which must not be buffered or cut off.
    location /api/ {
        set $api_upstream http://api:8000;
        proxy_pass $api_upstream;
        proxy_http_version 1.1;
        proxy_set_header Connection "";

        proxy_set_header Host $host;
        proxy_set_header X-Real-IP $remote_addr;
        proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
        proxy_set_header X-Forwarded-Proto $scheme;

        proxy_buffering off;
        proxy_cache off;
        gzip off;
        proxy_read_timeout 3600s;
    }

    # File names under _app/immutable contain a content hash, so they never change.
    location /_app/immutable/ {
        expires 1y;
        try_files $uri =404;
    }

    # The shell must be re-fetched so a new deploy is picked up.
    location = /index.html {
        expires -1;
    }

    # Single-page app: unknown paths get the shell.
    location / {
        try_files $uri $uri/ /index.html;
    }
}
